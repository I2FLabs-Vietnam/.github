<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05070e"/>
      <stop offset="50%" stop-color="#0a0f1d"/>
      <stop offset="100%" stop-color="#04060b"/>
    </linearGradient>
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00f0ff" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#7000ff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="scanGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00f0ff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0"/>
    </linearGradient>
    <pattern id="cyberGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.7" stroke-opacity="0.55"/>
      <circle cx="40" cy="40" r="1" fill="#38bdf8" fill-opacity="0.3"/>
    </pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    .font-mono { font-family: 'JetBrains Mono', 'Fira Code', 'Consolas', monospace; }
    .font-sans { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    .title-main { font-size: 54px; font-weight: 900; fill: #f8fafc; letter-spacing: 5px; }
    .title-sub { font-size: 14px; font-weight: 600; fill: #00f0ff; letter-spacing: 6px; }
    .hud-label { font-size: 11px; fill: #64748b; letter-spacing: 2px; }
    .hud-val { font-size: 12px; fill: #e2e8f0; font-weight: 700; }
    .term-text { font-size: 13px; fill: #94a3b8; }
    .term-cmd { font-size: 13px; fill: #38bdf8; font-weight: 600; }
    .term-ok { font-size: 12px; fill: #10b981; }
    .pulse-dot { animation: pulse 2s infinite ease-in-out; }
    .blink { animation: blinkAnim 1.1s step-end infinite; }
    .scanline { animation: scanMove 6s linear infinite; }
    .data-stream { stroke-dasharray: 8 6; animation: dashFlow 1.5s linear infinite; }
    .float-slow { animation: floatY 4s ease-in-out infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.25; } }
    @keyframes blinkAnim { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
    @keyframes scanMove { 0% { transform: translateY(-430px); } 100% { transform: translateY(430px); } }
    @keyframes dashFlow { to { stroke-dashoffset: -28; } }
    @keyframes floatY { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-5px); } }
  </style>

  <!-- Outer Frame & Background -->
  <rect width="1200" height="430" rx="16" fill="url(#bgGrad)"/>
  <rect width="1200" height="430" rx="16" fill="url(#cyberGrid)"/>

  <!-- Animated Scanline Overlay -->
  <rect class="scanline" x="0" y="0" width="1200" height="140" fill="url(#scanGrad)" pointer-events="none"/>

  <!-- Ambient Neural Circuit Lines -->
  <g stroke="#1e293b" stroke-width="1.5" fill="none">
    <path d="M 0 80 L 180 80 L 210 110 L 450 110"/>
    <path d="M 1200 350 L 960 350 L 930 320 L 720 320"/>
    <path d="M 820 0 L 820 45 L 850 75 L 1200 75"/>
  </g>
  <g stroke="url(#accentGrad)" stroke-width="1.5" fill="none" class="data-stream" opacity="0.65">
    <path d="M 0 80 L 180 80 L 210 110 L 450 110"/>
    <path d="M 1200 350 L 960 350 L 930 320 L 720 320"/>
  </g>

  <!-- Outer Cybernetic Border -->
  <rect x="12" y="12" width="1176" height="406" rx="12" fill="none" stroke="#1e293b" stroke-width="1.5"/>
  <!-- Corner Brackets -->
  <path d="M 12 45 L 12 20 Q 12 12 20 12 L 50 12" fill="none" stroke="#00f0ff" stroke-width="2.5" filter="url(#glow)"/>
  <path d="M 1150 12 L 1180 12 Q 1188 12 1188 20 L 1188 45" fill="none" stroke="#00f0ff" stroke-width="2.5" filter="url(#glow)"/>
  <path d="M 12 385 L 12 410 Q 12 418 20 418 L 50 418" fill="none" stroke="#a855f7" stroke-width="2.5" filter="url(#glow)"/>
  <path d="M 1150 418 L 1180 418 Q 1188 418 1188 410 L 1188 385" fill="none" stroke="#a855f7" stroke-width="2.5" filter="url(#glow)"/>

  <!-- Top Telemetry Bar -->
  <g transform="translate(45, 42)" class="font-mono">
    <circle cx="6" cy="-4" r="4.5" fill="#10b981" class="pulse-dot" filter="url(#glow)"/>
    <text x="18" y="0" class="hud-val" fill="#10b981">SYS.STATUS // ONLINE</text>
    <text x="195" y="0" class="hud-label">|  NODE: VN-SGN-HQ  |  ARCH: AUTONOMOUS-SWARM-V4  |  ENCRYPTION: ZK-ED25519</text>
    <text x="980" y="0" class="hud-val" fill="#38bdf8">I2F.SPACE // 0x9F2E</text>
  </g>
  <line x1="45" y1="56" x2="1155" y2="56" stroke="#1e293b" stroke-width="1"/>

  <!-- Left Column: Brand Identity & Manifesto -->
  <g transform="translate(55, 130)">
    <text x="0" y="0" class="font-mono title-sub">FRONTIER AI &amp; SYSTEMS RESEARCH COLLECTIVE</text>
    <text x="0" y="58" class="font-sans title-main">I2FLABS <tspan fill="url(#accentGrad)">VIETNAM</tspan></text>
    <rect x="0" y="76" width="520" height="2" fill="url(#cyanGlow)"/>

    <text x="0" y="112" class="font-sans" font-size="15.5" fill="#cbd5e1" font-weight="400">
      Engineering next-generation <tspan fill="#38bdf8" font-weight="600">Cognitive Architectures</tspan>, <tspan fill="#a855f7" font-weight="600">Microkernel Runtimes</tspan>,
    </text>
    <text x="0" y="136" class="font-sans" font-size="15.5" fill="#cbd5e1" font-weight="400">
      <tspan fill="#10b981" font-weight="600">Zero-Knowledge Protocols</tspan>, and <tspan fill="#f8fafc" font-weight="600">Autonomous Multi-Agent Swarms</tspan>.
    </text>

    <!-- Metric Pills -->
    <g transform="translate(0, 168)" class="font-mono">
      <rect x="0" y="0" width="160" height="54" rx="8" fill="#0f172a" fill-opacity="0.85" stroke="#1e293b" stroke-width="1.2"/>
      <path d="M 0 12 L 0 42" stroke="#00f0ff" stroke-width="3"/>
      <text x="16" y="22" class="hud-label">RESEARCH LABS</text>
      <text x="16" y="42" font-size="16" font-weight="800" fill="#f8fafc">11 DIVISIONS</text>

      <rect x="176" y="0" width="185" height="54" rx="8" fill="#0f172a" fill-opacity="0.85" stroke="#1e293b" stroke-width="1.2"/>
      <path d="M 176 12 L 176 42" stroke="#a855f7" stroke-width="3"/>
      <text x="192" y="22" class="hud-label">CORE PARADIGM</text>
      <text x="192" y="42" font-size="16" font-weight="800" fill="#f8fafc">NEUROMORPHIC</text>

      <rect x="377" y="0" width="175" height="54" rx="8" fill="#0f172a" fill-opacity="0.85" stroke="#1e293b" stroke-width="1.2"/>
      <path d="M 377 12 L 377 42" stroke="#10b981" stroke-width="3"/>
      <text x="393" y="22" class="hud-label">SECURITY LAYER</text>
      <text x="393" y="42" font-size="16" font-weight="800" fill="#f8fafc">ZERO-TRUST ZK</text>
    </g>
  </g>

  <!-- Right Column: Interactive Live Terminal Window -->
  <g transform="translate(650, 92)" class="float-slow">
    <!-- Terminal Shadow & Body -->
    <rect x="4" y="6" width="500" height="270" rx="10" fill="#000000" fill-opacity="0.6"/>
    <rect x="0" y="0" width="500" height="270" rx="10" fill="#090d16" stroke="#1e293b" stroke-width="1.5"/>
    <!-- Terminal Header -->
    <path d="M 0 10 Q 0 0 10 0 L 490 0 Q 500 0 500 10 L 500 32 L 0 32 Z" fill="#111827"/>
    <line x1="0" y1="32" x2="500" y2="32" stroke="#1e293b" stroke-width="1"/>
    <circle cx="18" cy="16" r="5.5" fill="#ef4444"/>
    <circle cx="36" cy="16" r="5.5" fill="#f59e0b"/>
    <circle cx="54" cy="16" r="5.5" fill="#10b981"/>
    <text x="250" y="20" text-anchor="middle" class="font-mono" font-size="11.5" fill="#64748b">root@i2flabs-vn: ~/kernel-telemetry</text>

    <!-- Terminal Content -->
    <g transform="translate(20, 58)" class="font-mono">
      <text x="0" y="0" class="term-cmd">root@i2f:~# <tspan fill="#f8fafc">./bootstrap_collective.sh --verify-zk</tspan></text>
      <text x="0" y="24" class="term-ok">[✓] Loading Microkernel &amp; Zero-Copy IPC Reactor...</text>
      <text x="0" y="46" class="term-ok">[✓] Mounting 11 Specialized Research Divisions...</text>
      <text x="0" y="68" class="term-ok">[✓] Syncing PiperNet Binary Wire &amp; Gossip Mesh...</text>
      <text x="0" y="90" class="term-ok">[✓] Dialectical Multi-Agent Swarm: CONVERGED</text>

      <line x1="0" y1="106" x2="460" y2="106" stroke="#1e293b" stroke-dasharray="4 4"/>

      <text x="0" y="128" class="term-text">TARGET_DOMAIN   : <tspan fill="#38bdf8">Artificial General Intelligence &amp; Systems</tspan></text>
      <text x="0" y="150" class="term-text">CONSENSUS_PROOF : <tspan fill="#a855f7">Deterministic Hypergraph + Ed25519</tspan></text>
      <text x="0" y="172" class="term-text">ORIGIN_COORDS   : <tspan fill="#f8fafc">Vietnam // Global Distributed Mesh</tspan></text>

      <text x="0" y="198" class="term-cmd">root@i2f:~# <tspan fill="#10b981">echo "Ready to dismantle the impossible."</tspan><tspan class="blink" fill="#00f0ff"> █</tspan></text>
    </g>
  </g>

  <!-- Bottom Footer Bar -->
  <line x1="45" y1="384" x2="1155" y2="384" stroke="#1e293b" stroke-width="1"/>
  <g transform="translate(45, 403)" class="font-mono">
    <text x="0" y="0" class="hud-label">PROTOCOL: PIPERNET-V2  //  LATENCY: 0.14ms  //  FORMAL VERIFICATION: PASSED</text>
    <text x="1110" y="0" text-anchor="end" class="hud-label" fill="#38bdf8">HTTPS://WWW.I2F.SPACE</text>
  </g>
</svg>